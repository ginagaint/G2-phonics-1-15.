<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phonics Adventure</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(#fff8ed,#eef7ff);color:#2f3542}.app{width:min(1000px,94vw);margin:auto;padding:24px 0}.screen{display:none}.screen.active{display:block}.card{background:#fff;border-radius:24px;padding:22px;box-shadow:0 10px 30px #00000012}.title{text-align:center;font-size:42px;margin:6px 0 8px}.sub{text-align:center;color:#667085}.grid{display:grid;grid-template-columns:repeat(13,1fr);gap:8px}.letter{border:0;border-radius:13px;padding:14px 0;background:#fff;box-shadow:0 3px 10px #0002;font-size:20px;font-weight:800;cursor:pointer}.letter.on{background:#8fd9c7;outline:3px solid #4aa995}.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}button{font:inherit}.primary,.secondary,.sound,.choice,.next{border:0;border-radius:16px;font-weight:800;cursor:pointer}.primary{background:#ffd36a;padding:14px 24px}.secondary{background:#fff;padding:12px 18px;box-shadow:0 3px 10px #0002}.sound{background:#8fc4ff;padding:16px 26px;font-size:21px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.badge{background:#fff;padding:9px 13px;border-radius:999px;box-shadow:0 3px 10px #0002;font-weight:800}.bar{height:12px;background:#e9edf2;border-radius:99px;overflow:hidden;margin:16px 0}.fill{height:100%;background:#8fd9c7;width:0}.q{text-align:center}.prompt{font-size:30px;font-weight:900;margin:14px 0}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:22px}.choice{background:#fff;border:3px solid #e7eaf0;padding:24px;font-size:52px}.choice.good{background:#c9f2d7;border-color:#52b975}.choice.bad{background:#ffd7d7;border-color:#e26b6b}.feedback{min-height:30px;font-size:19px;font-weight:800;margin:15px 0}.next{display:none;background:#ffd36a;padding:13px 22px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}.level{background:#fff;border:2px solid #e5e7eb;border-radius:14px;padding:10px;text-align:center;font-weight:800}.level.on{background:#edfdf8;border-color:#4aa995}.small{font-size:12px;color:#667085;display:block;margin-top:4px}.note{text-align:center;color:#777;font-size:13px}@media(max-width:760px){.grid{grid-template-columns:repeat(7,1fr)}.levels{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.grid{grid-template-columns:repeat(5,1fr)}.choices{grid-template-columns:1fr}}
</style>
</head>
<body><div class="app">
<section id="selectScreen" class="screen active"><h1 class="title">🔤 Phonics Adventure</h1><p class="sub">先選擇要練習的字母</p><div class="card"><div id="letterGrid" class="grid"></div><div class="row"><button id="allBtn" class="secondary">全部選取</button><button id="clearBtn" class="secondary">清除</button><button id="startBtn" class="primary">開始遊戲 ▶</button></div><p class="note">播放按鈕已改成 Safari / iPad 相容寫法。</p></div></section>
<section id="gameScreen" class="screen"><div class="levels"><div class="level" id="lv0">Level 1<span class="small">聽字母名</span></div><div class="level" id="lv1">Level 2<span class="small">聽字母音</span></div><div class="level" id="lv2">Level 3<span class="small">聽 CVC 選字首</span></div><div class="level" id="lv3">Level 4<span class="small">聽單字選目標字母</span></div></div><div class="top"><span id="levelBadge" class="badge"></span><span id="scoreBadge" class="badge"></span><button id="backBtn" class="secondary">← 重新選字母</button></div><div class="bar"><div id="fill" class="fill"></div></div><div class="card q"><div id="qNo"></div><div id="prompt" class="prompt"></div><button id="playBtn" type="button" class="sound">🔊 播放聲音</button><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><button id="nextBtn" type="button" class="next">下一題 →</button></div></section>
<section id="doneScreen" class="screen"><div class="card q"><div style="font-size:64px">🏆</div><h2>完成！</h2><div id="finalScore" style="font-size:54px;font-weight:900"></div><div class="row"><button id="againBtn" class="primary">再玩一次</button><button id="chooseBtn" class="secondary">重新選字母</button></div></div></section>
<audio id="audioPlayer" preload="metadata"></audio></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const seg={"A_name":[0.15,3.18],"A_sound":[3.36,7.513],"B_name":[7.693,10.541],"B_sound":[10.721,14.352],"C_name":[14.532,17.118],"C_sound":[17.298,21.582],"D_name":[21.762,24.583],"D_sound":[24.763,28.577],"E_name":[28.757,31.108],"E_sound":[31.287,35.075],"F_name":[35.255,37.502],"F_sound":[37.682,41.652],"G_name":[41.832,44.131],"G_sound":[44.311,47.89],"H_name":[48.069,50.211],"H_sound":[50.391,53.918],"I_name":[54.098,56.188],"I_sound":[56.368,59.711],"J_name":[59.891,62.32],"J_sound":[62.5,66.131],"K_name":[66.311,68.558],"K_sound":[68.738,72.369],"L_name":[72.549,74.691],"L_sound":[74.871,78.737],"M_name":[78.917,81.215],"M_sound":[81.395,84.948],"N_name":[85.128,87.27],"N_sound":[87.45,91.473],"O_name":[91.653,94.134],"O_sound":[94.314,98.598],"P_name":[98.778,101.208],"P_sound":[101.387,105.149],"Q_name":[105.329,107.497],"Q_sound":[107.677,111.648],"R_name":[111.828,113.865],"R_sound":[114.045,117.415],"S_name":[117.595,119.449],"S_sound":[119.629,123.234],"T_name":[123.414,125.478],"T_sound":[125.658,129.028],"U_name":[129.207,131.506],"U_sound":[131.686,135.657],"V_name":[135.837,137.874],"V_sound":[138.054,142.495],"W_name":[142.675,145.548],"W_sound":[145.728,149.673],"X_name":[149.853,151.89],"X_sound":[152.07,156.302],"Y_name":[156.482,158.467],"Y_sound":[158.647,162.592],"Z_name":[162.771,164.914],"Z_sound":[165.093,169.351]};
const words={A:['cat','map'],B:['bat','bag'],C:['cat','cap'],D:['dog','dot'],E:['hen','net'],F:['fan','fin'],G:['gap','gum'],H:['hat','hop'],I:['pig','sit'],J:['jam','jet'],K:['kid','kit'],L:['leg','log'],M:['map','man'],N:['net','nut'],O:['dog','top'],P:['pig','pin'],Q:['quit','quiz'],R:['red','run'],S:['sun','sit'],T:['top','tap'],U:['sun','run'],V:['van','vet'],W:['web','wig'],X:['fox','box'],Y:['yak','yam'],Z:['zip','zap']};
let selected=new Set(['A','B','C','D','T']),level=0,qi=0,score=0,current=null,answered=false,timer=null;
const player=$('audioPlayer');
function show(id){['selectScreen','gameScreen','doneScreen'].forEach(x=>$(x).classList.remove('active'));$(id).classList.add('active')}
function rand(a){return a[Math.floor(Math.random()*a.length)]}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function renderLetters(){const g=$('letterGrid');g.innerHTML='';letters.forEach(L=>{const b=document.createElement('button');b.type='button';b.className='letter'+(selected.has(L)?' on':'');b.textContent=L;b.addEventListener('click',()=>{selected.has(L)?selected.delete(L):selected.add(L);renderLetters()});g.appendChild(b)})}
function distract(correct,lower=false){let p=shuffle(letters.filter(x=>x!==correct));return p.slice(0,3).map(x=>lower?x.toLowerCase():x)}
function mkQ(){const arr=[...selected];if(level===0||level===1){const L=rand(arr),lower=Math.random()<.5,ans=lower?L.toLowerCase():L;return{type:level===0?'name':'sound',key:`${L}_${level===0?'name':'sound'}`,correct:ans,choices:shuffle([ans,...distract(L,lower)]),lower}}
const focus=rand(arr),w=rand(words[focus]||['cat']);if(level===2){const first=w[0].toUpperCase();return{type:'word',word:w,correct:first,choices:shuffle([first,...distract(first)])}}return{type:'word',word:w,correct:focus,choices:shuffle([focus,...distract(focus)])}}
function renderQ(){answered=false;current=mkQ();$('qNo').textContent=`Question ${qi+1} / 8`;$('levelBadge').textContent=`Level ${level+1}`;$('scoreBadge').textContent=`⭐ ${score}`;$('fill').style.width=`${((level*8+qi)/32)*100}%`;for(let i=0;i<4;i++)$('lv'+i).classList.toggle('on',i===level);$('prompt').textContent=level===0?(current.lower?'聽字母名稱，選出正確的小寫字母':'聽字母名稱，選出正確的大寫字母'):level===1?(current.lower?'聽字母音，選出正確的小寫字母':'聽字母音，選出正確的大寫字母'):level===2?'聽單字，選出字首音':'聽單字，選出目標字母';$('feedback').textContent='';$('nextBtn').style.display='none';const box=$('choices');box.innerHTML='';current.choices.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=c;b.addEventListener('click',()=>answer(c,b));box.appendChild(b)})}
function speakText(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.7;speechSynthesis.speak(u)}catch(e){$('feedback').textContent='⚠️ 無法播放聲音'}}
function playCurrent(){clearTimeout(timer);player.pause();$('feedback').textContent='';if(current.type==='word'){speakText(current.word);return}const s=seg[current.key];if(!s){speakText(current.key[0]);return}const start=()=>{try{player.currentTime=s[0];const p=player.play();if(p&&p.then)p.then(()=>{timer=setTimeout(()=>player.pause(),(s[1]-s[0])*1000)}).catch(()=>speakText(current.key[0]));}catch(e){speakText(current.key[0])}};if(!player.src.includes('letters_sprite.mp3')){player.src='audio/letters_sprite.mp3?v=20260930-6';player.load()}if(player.readyState>=1)start();else{player.addEventListener('loadedmetadata',start,{once:true});player.addEventListener('error',()=>speakText(current.key[0]),{once:true})}}
function answer(c,b){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(x=>{if(x.textContent===current.correct)x.classList.add('good')});if(c===current.correct){score++;$('feedback').textContent='✅ 答對了！'}else{b.classList.add('bad');$('feedback').textContent=`❌ 正確答案是 ${current.correct}`}$('scoreBadge').textContent=`⭐ ${score}`;$('nextBtn').style.display='inline-block'}
$('allBtn').addEventListener('click',()=>{letters.forEach(x=>selected.add(x));renderLetters()});$('clearBtn').addEventListener('click',()=>{selected.clear();renderLetters()});$('startBtn').addEventListener('click',()=>{if(selected.size<2){alert('請至少選 2 個字母');return}level=0;qi=0;score=0;show('gameScreen');renderQ()});$('playBtn').addEventListener('click',e=>{e.preventDefault();playCurrent()});$('nextBtn').addEventListener('click',()=>{qi++;if(qi>=8){level++;qi=0;if(level>=4){$('finalScore').textContent=`${score} / 32`;show('doneScreen');return}}renderQ()});$('backBtn').addEventListener('click',()=>show('selectScreen'));$('againBtn').addEventListener('click',()=>{level=0;qi=0;score=0;show('gameScreen');renderQ()});$('chooseBtn').addEventListener('click',()=>show('selectScreen'));renderLetters();
})();
</script></body></html>
