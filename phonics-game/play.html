<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phonics Adventure</title>
<style>
:root{--ink:#2f3542;--yellow:#ffd36a;--mint:#8fd9c7;--blue:#8fc4ff;--good:#c9f2d7;--bad:#ffd7d7}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(#fff8ed,#f3f9ff);color:var(--ink);min-height:100vh}.app{width:min(1100px,94vw);margin:auto;padding:28px 0 48px}.screen{display:none}.screen.active{display:block}.title{text-align:center;font-size:clamp(34px,5vw,58px);font-weight:900;margin:8px 0}.subtitle{text-align:center;color:#6b7280;margin-bottom:22px}.card,.question-card{background:#fff;border-radius:26px;padding:24px;box-shadow:0 12px 35px rgba(57,50,40,.12)}.letter-grid{display:grid;grid-template-columns:repeat(13,1fr);gap:10px}.letter-pick{aspect-ratio:1;border:0;border-radius:14px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.08);font-size:24px;font-weight:900;cursor:pointer}.letter-pick.selected{background:var(--mint);outline:3px solid #4aa995}.controls{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:22px}.primary,.secondary,.sound-btn,.choice,.next-btn{border:0;border-radius:18px;font:inherit;font-weight:900;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.12)}.primary{background:var(--yellow);padding:15px 28px}.secondary{background:white;padding:13px 20px}.sound-btn{background:var(--blue);padding:18px 30px;font-size:22px;min-width:210px}.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.level{background:#fff;border:2px solid #e5e7eb;border-radius:18px;padding:14px;text-align:center;font-weight:800}.level.current{border-color:#4aa995;background:#edfdf8}.level small{display:block;color:#7a8493;margin-top:4px}.game-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.badge{background:#fff;border-radius:999px;padding:10px 14px;box-shadow:0 4px 12px rgba(0,0,0,.07);font-weight:800}.progress-wrap{height:14px;background:#ebeef3;border-radius:999px;overflow:hidden;margin-bottom:20px}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--blue))}.question-card{text-align:center}.question-no{color:#778092;font-weight:800}.prompt{font-size:clamp(25px,4vw,40px);font-weight:900;margin:10px 0 18px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:26px}.choice{background:#fff;border:3px solid #e7eaf0;padding:28px 16px;font-size:clamp(35px,7vw,74px);min-height:130px}.choice.correct{background:var(--good);border-color:#52b975}.choice.wrong{background:var(--bad);border-color:#e26b6b}.feedback{min-height:38px;margin-top:18px;font-size:20px;font-weight:900}.feedback.good{color:#27894b}.feedback.bad{color:#c64040}.feedback.missing{color:#9b6518}.next-btn{display:none;background:var(--yellow);padding:14px 26px;margin:14px auto 0}.summary{text-align:center;padding:40px 20px}.score-big{font-size:72px;font-weight:1000}@media(max-width:850px){.letter-grid{grid-template-columns:repeat(7,1fr)}.levels{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.letter-grid{grid-template-columns:repeat(5,1fr)}.choices{grid-template-columns:1fr}.game-top{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<div class="app">
<section id="selectScreen" class="screen active"><h1 class="title">🔤 Phonics Adventure</h1><p class="subtitle">先選擇要練習的字母</p><div class="card"><h2 style="text-align:center;margin-top:0">選擇練習字母</h2><div id="letterGrid" class="letter-grid"></div><div class="controls"><button id="selectAllBtn" class="secondary">全部選取</button><button id="clearBtn" class="secondary">清除</button><button id="startBtn" class="primary">開始遊戲 ▶</button></div></div></section>
<section id="gameScreen" class="screen"><div class="levels"><div class="level" data-level="0">Level 1<small>聽字母名 → 選大小寫</small></div><div class="level" data-level="1">Level 2<small>聽字母音 → 選大小寫</small></div><div class="level" data-level="2">Level 3<small>聽 CVC → 選字首音</small></div><div class="level" data-level="3">Level 4<small>聽 CVC → 選中間母音 V</small></div></div><div class="game-top"><div id="levelBadge" class="badge">Level 1</div><div id="scoreBadge" class="badge">⭐ 0</div><button id="backBtn" class="secondary">← 重新選字母</button></div><div class="progress-wrap"><div id="progress" class="progress"></div></div><div class="question-card"><div id="questionNo" class="question-no"></div><div id="prompt" class="prompt"></div><button id="playBtn" class="sound-btn" type="button">🔊 播放聲音</button><div id="choices" class="choices"></div><div id="feedback" class="feedback"></div><button id="nextBtn" class="next-btn" type="button">下一題 →</button></div></section>
<section id="summaryScreen" class="screen"><div class="card summary"><div style="font-size:70px">🏆</div><h2>闖關完成！</h2><div id="finalScore" class="score-big"></div><p id="finalText"></p><div class="controls"><button id="againBtn" class="primary">再玩一次</button><button id="chooseAgainBtn" class="secondary">重新選字母</button></div></div></section>
</div>
<audio id="audioPlayer" preload="none"></audio>
<script>
(()=>{
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const vowels=['A','E','I','O','U'];
const lowerSound=new Set('ABCDEFGHIJKLM'.split(''));
const cvc=[
['A','cat','C','A'],['A','map','M','A'],['B','bat','B','A'],['B','bag','B','A'],['C','cat','C','A'],['C','cap','C','A'],['D','dog','D','O'],['D','dot','D','O'],['E','hen','H','E'],['E','net','N','E'],['F','fan','F','A'],['F','fin','F','I'],['G','gap','G','A'],['G','gum','G','U'],['H','hat','H','A'],['H','hop','H','O'],['I','pig','P','I'],['I','sit','S','I'],['J','jam','J','A'],['J','jet','J','E'],['K','kid','K','I'],['K','kit','K','I'],['L','leg','L','E'],['L','log','L','O'],['M','map','M','A'],['M','man','M','A'],['N','net','N','E'],['N','nut','N','U'],['O','dog','D','O'],['O','top','T','O'],['P','pig','P','I'],['P','pin','P','I'],['R','red','R','E'],['R','run','R','U'],['S','sun','S','U'],['S','sit','S','I'],['T','top','T','O'],['T','tap','T','A'],['U','sun','S','U'],['U','run','R','U'],['V','van','V','A'],['V','vet','V','E'],['W','web','W','E'],['W','wig','W','I'],['X','fox','F','O'],['X','box','B','O'],['Y','yak','Y','A'],['Y','yam','Y','A'],['Z','zip','Z','I'],['Z','zap','Z','A']
].map(([focus,word,first,vowel])=>({focus,word,first,vowel}));
const $=id=>document.getElementById(id),audio=$('audioPlayer');
let selected=new Set(['A','B','C','D','T']),level=0,qIndex=0,score=0,answered=false,currentQ=null,lastKey=null;const perLevel=8;
function show(id){['selectScreen','gameScreen','summaryScreen'].forEach(x=>$(x).classList.toggle('active',x===id));}
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function rand(a){return a[Math.floor(Math.random()*a.length)]}
function refresh(){document.querySelectorAll('.letter-pick').forEach(b=>b.classList.toggle('selected',selected.has(b.dataset.letter)))}
letters.forEach(L=>{const b=document.createElement('button');b.type='button';b.className='letter-pick';b.textContent=L;b.dataset.letter=L;b.addEventListener('click',()=>{selected.has(L)?selected.delete(L):selected.add(L);refresh()});$('letterGrid').appendChild(b)});refresh();
$('selectAllBtn').addEventListener('click',()=>{letters.forEach(L=>selected.add(L));refresh()});$('clearBtn').addEventListener('click',()=>{selected.clear();refresh()});
function distract(correct,count=3){let p=[...selected].filter(x=>x!==correct);for(const x of letters)if(p.length<count&&x!==correct&&!p.includes(x))p.push(x);return shuffle(p).slice(0,count)}
function chooseNoRepeat(pool,keyFn){let usable=pool.filter(x=>keyFn(x)!==lastKey);if(!usable.length)usable=pool;const x=rand(usable);lastKey=keyFn(x);return x;}
function makeQ(){
 const sel=[...selected];
 if(level===0||level===1){const candidates=sel.map(L=>({L}));const x=chooseNoRepeat(candidates,o=>`${level}:${o.L}`);const L=x.L,low=Math.random()<.5;return{type:level===0?'name':'sound',L,correct:low?L.toLowerCase():L,lower:low,choices:shuffle([low?L.toLowerCase():L,...distract(L).map(z=>low?z.toLowerCase():z)])}};
 if(level===2){let p=cvc.filter(x=>selected.has(x.first));if(!p.length)p=cvc;const x=chooseNoRepeat(p,o=>`2:${o.word}`);return{type:'cvcFirst',word:x.word,correct:x.first,choices:shuffle([x.first,...distract(x.first)])}};
 let p=cvc.filter(x=>selected.has(x.focus));if(!p.length)p=cvc;const x=chooseNoRepeat(p,o=>`3:${o.word}`);return{type:'cvcVowel',word:x.word,correct:x.vowel,choices:shuffle(vowels)};
}
function render(){answered=false;currentQ=makeQ();document.querySelectorAll('.level').forEach((e,i)=>e.classList.toggle('current',i===level));$('levelBadge').textContent=`Level ${level+1}`;$('scoreBadge').textContent=`⭐ ${score}`;$('progress').style.width=`${((level*perLevel+qIndex)/(perLevel*4))*100}%`;$('questionNo').textContent=`Question ${qIndex+1} / ${perLevel}`;const prompts=[currentQ.lower?'聽字母名稱，選出正確的小寫字母':'聽字母名稱，選出正確的大寫字母',currentQ.lower?'聽字母音，選出正確的小寫字母':'聽字母音，選出正確的大寫字母','聽 CVC 字詞，選出它的字首音','聽 CVC 字詞，選出中間的母音 V'];$('prompt').textContent=prompts[level];$('feedback').textContent='';$('feedback').className='feedback';$('nextBtn').style.display='none';$('choices').innerHTML='';currentQ.choices.forEach(ch=>{const b=document.createElement('button');b.type='button';b.className='choice';b.textContent=ch;b.addEventListener('click',()=>answer(ch,b));$('choices').appendChild(b)});}
function speak(text){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.72;speechSynthesis.cancel();speechSynthesis.speak(u)}
function play(){audio.pause();audio.currentTime=0;$('feedback').textContent='';if(currentQ.type==='name'||currentQ.type==='sound'){const file=currentQ.type==='name'?`${currentQ.L}.mp3`:`${currentQ.L}_${lowerSound.has(currentQ.L)?'sound':'Sound'}.mp3`;audio.src=`audio/${file}?v=9`;audio.play().catch(()=>{$('feedback').textContent=`⚠️ 無法播放 ${file}`;$('feedback').className='feedback missing'});}else{speak(currentQ.word)}}
function answer(ch,b){if(answered)return;answered=true;document.querySelectorAll('.choice').forEach(x=>{if(x.textContent===currentQ.correct)x.classList.add('correct')});if(ch===currentQ.correct){score++;$('feedback').textContent='✅ 答對了！';$('feedback').className='feedback good'}else{b.classList.add('wrong');$('feedback').textContent=`❌ 正確答案是 ${currentQ.correct}`;$('feedback').className='feedback bad'}$('scoreBadge').textContent=`⭐ ${score}`;$('nextBtn').style.display='block'}
$('playBtn').addEventListener('click',play);$('nextBtn').addEventListener('click',()=>{qIndex++;if(qIndex>=perLevel){level++;qIndex=0;lastKey=null;if(level>=4){$('finalScore').textContent=`${score} / ${perLevel*4}`;$('finalText').textContent=score>=28?'太棒了！':score>=20?'很不錯！再玩一次會更熟。':'可以先多練 Level 1 和 Level 2。';show('summaryScreen');return}}render()});$('backBtn').addEventListener('click',()=>show('selectScreen'));$('againBtn').addEventListener('click',()=>{level=0;qIndex=0;score=0;lastKey=null;show('gameScreen');render()});$('chooseAgainBtn').addEventListener('click',()=>show('selectScreen'));$('startBtn').addEventListener('click',()=>{if(selected.size<2){alert('請至少選 2 個字母');return}level=0;qIndex=0;score=0;lastKey=null;show('gameScreen');render()});
})();
</script>
</body></html>
